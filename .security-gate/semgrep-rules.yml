#
# The security gate's own Semgrep rules. The gate runs them from the default
# branch in a Semgrep call of their own, apart from the Semgrep Registry rules
# it downloads at run time; a pull request that changes this file is not
# trusted until a human confirms it (SG-TRUST-001). Each rule has a canary of
# the gate that must be found in the same Semgrep call.
#
# SPDX-License-Identifier: MIT
# Copyright (c) 2026 the vibecodepanoply authors
