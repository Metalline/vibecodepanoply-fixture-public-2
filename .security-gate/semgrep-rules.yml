# of this file (the "Software"), to deal in the Software without restriction,
# including without limitation the rights to use, copy, modify, merge,
# publish, distribute, sublicense, and/or sell copies of the Software, and to
# permit persons to whom the Software is furnished to do so, subject to the
# following conditions: the above copyright notice and this permission notice
# shall be included in all copies or substantial portions of the Software.
#
# THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
# IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
# FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE
# AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER
# LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,
# OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
# SOFTWARE.
#
# Severity: ERROR fails the gate, WARNING is reported below the threshold of
# .security-gate/lock.json and does not block.
#
# Of entries that share an id, semgrep 1.179.0 may drop all but the last on
# files without the text the last one looks for (ADR 0006). The two entries
# of an id below look for the same names (process.env and import.meta.env;
# chat.completions.create and responses.create), and tests/semgrep_fixtures.py
# has a case for every entry. sg-public-secret and sg-public-key are one
# entry each; they may report the same name, ERROR and WARNING on one line.
#
# The two rules on public variables share one list of public prefixes: the
# prefixes that Next.js, Nuxt, Expo, Create React App, Vue CLI, Gatsby, Vite
# (and electron-vite), Plasmo, Nx, Waku, Extension.js, Sanity Studio,
# Storybook, Umi, Taro, WXT and RedwoodJS compile into the client (ADR 0007).
# The bare PUBLIC prefix (SvelteKit, Astro, Qwik, Rsbuild, Vike) counts only
# where it is a prefix: after env and a dot, right before = (an environment
# file), before an import from $env/static/public or $env/dynamic/public,
# and fed from $X, ${X} or a secret, variable or env of a workflow. The
# prefix is matched in capitals, as the bundler matches it; the rest of the
# name in any case. A name starts a word, or follows the escape \n, \r or
# \t in a string that writes an environment file (printf, echo -e, a
# template literal): \b alone takes the escape's letter for a part of the
# word. A name ends in a whole KEY or TOKEN segment (or APIKEY), or in a
# camelCase Key or Token (apiKey); the name of a password in a whole
# PASSWORD, PASSWD, PASSPHRASE or PWD segment, or in their camelCase forms
# (adminPassword, userPwd), each with a number or an environment after it
# or not (PASSWORD2, _PASSWORD_PROD, _PWD_1: digits, PROD, PRODUCTION, DEV,
# DEVELOPMENT, STAGING, STAGE, STG, TEST, QA, UAT, LOCAL, PREVIEW; nothing
# else). The name of a source that is a password has PWD only after another
# segment: $PWD and $OLDPWD are the working directory of a shell. Every name
# starts with (?![A-Za-z0-9_]{129}): a word of more than 128 characters is
# no name, and without that bound one such word makes PCRE drop a pattern in
# the whole file, silently (ADR 0007). For the same reason the two parts of
# a JWT read as a value are bounded, to 1024 and 4096 characters (a Supabase
# key has about 200), and a URI read as a value to 32 characters of the
# scheme and 256 parts of the user and of the password: a character, or an
# expression of a workflow (${{ secrets.X }}, spaces in it) of up to 256.
# The parts cannot overlap, a $ starts an expression only before {{: with
# overlapping parts one long line of expressions dropped the pattern.
# A public name fed from another variable is read by the name of that
# variable too: $X and ${X} (environment files, compose, Dockerfiles,
# shell), process.env.X, and a secret, variable or env of a workflow.
# $X and ${X} count only as the whole value: $X, ${X}, or ${X} with a
# default or a message after :-, -, :=, =, :? or ?, and then the end of
# the value: a space or a line end (CRLF too), #, , ] or } of YAML,
# ; & | ) < or > of shell, the escape \n, \r or \t of a string, a line
# continuation, or the end of the file. A closing quote or backtick is no
# end by itself: one of those ends follows it, after up to four of them,
# each escaped or not ('${X}'" in a line echo writes, $X\" in an npm
# script). A reference that is a part of a longer value (the .pub file
# next to a private key: ${X}.pub, "${X}".pub, ${X}'.pub', $X\.pub; a
# directory under a directory of secrets: "$X"/public) is not read. The
# name in the reference is bounded to 128 characters, the default to 1024,
# the quotes to four and the backslashes before a quote or an escape to
# four, all possessive: without the bound of the default one line of
# 60 000 defaults without } kept semgrep on the file until its timeout.
# Not checked: custom prefixes (envPrefix and the like), channels without a
# prefix (next.config env, Nuxt runtimeConfig, Astro envField, Angular
# environments, DefinePlugin, Expo extra), other sources of a value (the
# legacy ENV X value of a Dockerfile, $(X) of make, ${{ github.token }},
# process.env.X after the bare PUBLIC prefix), and $X or ${X} inside a
# longer value ("Bearer ${X}", ${X}/v1).
rules:
  # A variable with a public prefix is compiled into the browser or app
  # bundle. Its name, its value or the name of the variable it is fed from
  # says it holds a secret, and no allowlist applies: SECRET, SERVICE_ROLE,
  # SERVICE_KEY or PRIVATE anywhere in the name; the key or token of a
  # vendor that has no publishable keys (LLM, speech and email APIs, Twilio,
  # OneSignal, GitHub, GitLab, Airtable, RapidAPI, SerpApi; the tokens of
  # Sanity); a role right before the end, with API or ACCESS between them or
  # not (an admin, master or server key, not the APPLICATION_SERVER_KEY of
  # Web Push, which is a public key; an admin, bot, bearer, refresh,
  # management, deploy, debug or Sentry auth token); a password (PASSWORD,
  # PASSWD, PASSPHRASE or PWD the last segment, a number or an environment
  # after it or not); a secret key as the value (sk_ and
  # rk_ keys of any mode, whsec_, sk- keys of LLM APIs, PostHog phx_ phs_
  # pha_ phr_, Sentry sntry, OneSignal os_v2_app_, Paddle pdl_, Mapbox sk.,
  # LaunchDarkly sdk-, Supabase sb_secret_ and service_role JWTs) or a URI
  # with a password (postgres://user:password@host, any scheme), whatever
  # the name; or a source named like that after : or = ($X or ${X} as the
  # whole value, process.env.X, a secret, variable or env of a workflow:
  # the vendor a segment and KEY or TOKEN the end of the source's name, or
  # the role or the password its end). Regex rule: it reads code,
  # environment and config files and workflows alike; not prose, which
  # names such variables to warn about them.
  - id: sg-public-secret
    languages: [regex]
    severity: ERROR
    message: >-
      A variable with a public prefix (NEXT_PUBLIC_, VITE_, EXPO_PUBLIC_,
      REACT_APP_, NUXT_PUBLIC_, PUBLIC_ and the like) holds a secret: its
      name, its value or the variable it is fed from says so. The bundler
      writes the value into the code that every visitor or app user
      downloads. Make the call that needs it on the server (an API route,
      server action or edge function), keep the key or password in a variable
      without the public prefix, and rotate it: the old one has already
      shipped.
    metadata:
      category: security
      confidence: HIGH
      cwe: "CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"
    paths:
      exclude: ["*.md", "*.mdx", "*.markdown", "*.rst", "*.adoc"]
    pattern-either:
      # 1. SECRET, SERVICE_ROLE, SERVICE_KEY or PRIVATE anywhere in the name
      - pattern-regex: (?:\b|(?<=\\[nrt]))(?![A-Za-z0-9_]{129})(?:NEXT_PUBLIC|NUXT_PUBLIC|EXPO_PUBLIC|REACT_APP|VUE_APP|GATSBY|(?:MAIN_|PRELOAD_|RENDERER_)?VITE|PLASMO_PUBLIC|NX_PUBLIC|WAKU_PUBLIC|EXTENSION_PUBLIC|SANITY_STUDIO|STORYBOOK|UMI_APP|TARO_APP|WXT|REDWOOD_ENV)_(?i:[A-Z0-9_]*(?:SECRET|SERVICE_?ROLE|SERVICE_?KEY|PRIVATE)[A-Z0-9_]*)
      # 2. the key or token of a vendor that has no publishable keys
      - pattern-regex: (?:\b|(?<=\\[nrt]))(?![A-Za-z0-9_]{129})(?:NEXT_PUBLIC|NUXT_PUBLIC|EXPO_PUBLIC|REACT_APP|VUE_APP|GATSBY|(?:MAIN_|PRELOAD_|RENDERER_)?VITE|PLASMO_PUBLIC|NX_PUBLIC|WAKU_PUBLIC|EXTENSION_PUBLIC|SANITY_STUDIO|STORYBOOK|UMI_APP|TARO_APP|WXT|REDWOOD_ENV)_+(?i:(?:[A-Z0-9]+_+)*(?:(?:OPENAI|ANTHROPIC|CLAUDE|GEMINI|GOOGLE_GENERATIVE_AI|GENAI|GROQ|MISTRAL|COHERE|DEEPSEEK|OPENROUTER|PERPLEXITY|REPLICATE|TOGETHER|FIREWORKS|XAI|ELEVENLABS|HUGGINGFACE|HF|AI|LLM|CHATGPT|GROK|KIMI|MOONSHOT|DEEPGRAM|ASSEMBLYAI|RESEND|SENDGRID|MAILGUN|POSTMARK|MAILCHIMP|TWILIO|ONESIGNAL|GITHUB|GH|GITLAB|AIRTABLE|RAPIDAPI|RAPID_API|SERPAPI|SERP_API)(?:_+[A-Z0-9]+)*|SANITY(?:_+STUDIO)?(?:_+(?:API|READ|WRITE|EDITOR|VIEWER|PREVIEW|AUTH|DEPLOY))*))(?:_+(?i:(?:API_?)?(?:KEY|TOKEN))|(?<=[a-z0-9])(?:A(?i:PI))?(?:K(?i:EY)|T(?i:OKEN)))\b
      # 3. a role right before the end of the name, API or ACCESS between
      - pattern-regex: (?:\b|(?<=\\[nrt]))(?![A-Za-z0-9_]{129})(?:NEXT_PUBLIC|NUXT_PUBLIC|EXPO_PUBLIC|REACT_APP|VUE_APP|GATSBY|(?:MAIN_|PRELOAD_|RENDERER_)?VITE|PLASMO_PUBLIC|NX_PUBLIC|WAKU_PUBLIC|EXTENSION_PUBLIC|SANITY_STUDIO|STORYBOOK|UMI_APP|TARO_APP|WXT|REDWOOD_ENV)_+(?i:(?:[A-Z0-9]+_+)*)(?:(?i:ADMIN|MASTER|(?<!APPLICATION_)SERVER)(?:_+(?i:(?:(?:API|ACCESS)_*)*KEY)|(?<=[a-z0-9])(?:A(?i:PI|CCESS)_*)*K(?i:EY))|(?i:ADMIN|BOT|BEARER|REFRESH|MANAGEMENT|DEPLOY|SENTRY_AUTH|DEBUG(?:_+[A-Z0-9]+)?)(?:_+(?i:(?:(?:API|ACCESS)_*)*TOKEN)|(?<=[a-z0-9])(?:A(?i:PI|CCESS)_*)*T(?i:OKEN)))\b
      # 4, 5. the bare PUBLIC prefix, with the names of 1, 2 and 9: after env and
      #    a dot; or right before =, before a GitHub secret of a workflow or
      #    before an import from $env/static/public or $env/dynamic/public
      - pattern-regex: (?<=env[.])(?![A-Za-z0-9_]{129})PUBLIC_+(?:(?i:[A-Z0-9_]*(?:SECRET|SERVICE_?ROLE|SERVICE_?KEY|PRIVATE)[A-Z0-9_]*)|(?i:(?:[A-Z0-9]+_+)*(?:(?:OPENAI|ANTHROPIC|CLAUDE|GEMINI|GOOGLE_GENERATIVE_AI|GENAI|GROQ|MISTRAL|COHERE|DEEPSEEK|OPENROUTER|PERPLEXITY|REPLICATE|TOGETHER|FIREWORKS|XAI|ELEVENLABS|HUGGINGFACE|HF|AI|LLM|CHATGPT|GROK|KIMI|MOONSHOT|DEEPGRAM|ASSEMBLYAI|RESEND|SENDGRID|MAILGUN|POSTMARK|MAILCHIMP|TWILIO|ONESIGNAL|GITHUB|GH|GITLAB|AIRTABLE|RAPIDAPI|RAPID_API|SERPAPI|SERP_API)(?:_+[A-Z0-9]+)*|SANITY(?:_+STUDIO)?(?:_+(?:API|READ|WRITE|EDITOR|VIEWER|PREVIEW|AUTH|DEPLOY))*))(?:_+(?i:(?:API_?)?(?:KEY|TOKEN))|(?<=[a-z0-9])(?:A(?i:PI))?(?:K(?i:EY)|T(?i:OKEN)))\b|(?:(?i:(?:[A-Z0-9]+_+)*(?:PASSWORD|PASSWD|PASSPHRASE|PWD))|(?i:[A-Z0-9_]*?)(?<=[a-z0-9])P(?i:ASSWORD|ASSWD|ASSPHRASE|WD))(?i:[0-9]*(?:_+(?:[0-9]+|PROD|PRODUCTION|DEV|DEVELOPMENT|STAGING|STAGE|STG|TEST|QA|UAT|LOCAL|PREVIEW))*)\b)
      - pattern-regex: (?:\b|(?<=\\[nrt]))(?![A-Za-z0-9_]{129})PUBLIC_+(?:(?i:[A-Z0-9_]*(?:SECRET|SERVICE_?ROLE|SERVICE_?KEY|PRIVATE)[A-Z0-9_]*)|(?i:(?:[A-Z0-9]+_+)*(?:(?:OPENAI|ANTHROPIC|CLAUDE|GEMINI|GOOGLE_GENERATIVE_AI|GENAI|GROQ|MISTRAL|COHERE|DEEPSEEK|OPENROUTER|PERPLEXITY|REPLICATE|TOGETHER|FIREWORKS|XAI|ELEVENLABS|HUGGINGFACE|HF|AI|LLM|CHATGPT|GROK|KIMI|MOONSHOT|DEEPGRAM|ASSEMBLYAI|RESEND|SENDGRID|MAILGUN|POSTMARK|MAILCHIMP|TWILIO|ONESIGNAL|GITHUB|GH|GITLAB|AIRTABLE|RAPIDAPI|RAPID_API|SERPAPI|SERP_API)(?:_+[A-Z0-9]+)*|SANITY(?:_+STUDIO)?(?:_+(?:API|READ|WRITE|EDITOR|VIEWER|PREVIEW|AUTH|DEPLOY))*))(?:_+(?i:(?:API_?)?(?:KEY|TOKEN))|(?<=[a-z0-9])(?:A(?i:PI))?(?:K(?i:EY)|T(?i:OKEN)))\b|(?:(?i:(?:[A-Z0-9]+_+)*(?:PASSWORD|PASSWD|PASSPHRASE|PWD))|(?i:[A-Z0-9_]*?)(?<=[a-z0-9])P(?i:ASSWORD|ASSWD|ASSPHRASE|WD))(?i:[0-9]*(?:_+(?:[0-9]+|PROD|PRODUCTION|DEV|DEVELOPMENT|STAGING|STAGE|STG|TEST|QA|UAT|LOCAL|PREVIEW))*)\b)\b(?:(?==(?!=))|(?=["']?\s*[:=]\s*["']?\$\{\{\s*secrets(?:[.]|\[))|(?=[\w\s,]{0,500}+\}\s*from\s*["']\$env/(?:static|dynamic)/public["']))
      # 6, 7. a secret key, a URI with a password (scheme://user:password@,
      #    either part from ${{ secrets.X }} or another expression of a
      #    workflow too) or a service_role JWT as the value, whatever the
      #    name; the bare PUBLIC prefix only right before =
      - pattern-regex: (?:(?:\b|(?<=\\[nrt]))(?![A-Za-z0-9_]{129})(?:NEXT_PUBLIC|NUXT_PUBLIC|EXPO_PUBLIC|REACT_APP|VUE_APP|GATSBY|(?:MAIN_|PRELOAD_|RENDERER_)?VITE|PLASMO_PUBLIC|NX_PUBLIC|WAKU_PUBLIC|EXTENSION_PUBLIC|SANITY_STUDIO|STORYBOOK|UMI_APP|TARO_APP|WXT|REDWOOD_ENV)_[A-Za-z0-9_]+["']?\s*[:=]\s*|(?:\b|(?<=\\[nrt]))(?![A-Za-z0-9_]{129})PUBLIC_+[A-Za-z0-9_]+=(?!=))["'`]?(?:sb_secret_|(?:sk|rk)_[A-Za-z0-9]{3}|whsec_|sk-(?:proj|svcacct|admin|ant|or)-|sk-[A-Za-z0-9]{20}|ph[xsar]_|sntry[usai]_|os_v2_app_|pdl_(?:live|sdbx)_apikey_|sk[.]eyJ|sdk-[0-9a-f]{8}-|[A-Za-z][A-Za-z0-9+.-]{0,31}://(?:[^\s:@/?#"'`$]|\$(?!\{\{)|\$\{\{[^}\n]{0,256}\}\}){0,256}+:(?:[^\s@/?#"'`$]|\$(?!\{\{)|\$\{\{[^}\n]{0,256}\}\}){1,256}+@)
      - pattern-regex: (?:(?:\b|(?<=\\[nrt]))(?![A-Za-z0-9_]{129})(?:NEXT_PUBLIC|NUXT_PUBLIC|EXPO_PUBLIC|REACT_APP|VUE_APP|GATSBY|(?:MAIN_|PRELOAD_|RENDERER_)?VITE|PLASMO_PUBLIC|NX_PUBLIC|WAKU_PUBLIC|EXTENSION_PUBLIC|SANITY_STUDIO|STORYBOOK|UMI_APP|TARO_APP|WXT|REDWOOD_ENV)_[A-Za-z0-9_]+["']?\s*[:=]\s*|(?:\b|(?<=\\[nrt]))(?![A-Za-z0-9_]{129})PUBLIC_+[A-Za-z0-9_]+=(?!=))["'`]?eyJ[A-Za-z0-9_-]{0,1024}\.[A-Za-z0-9_-]{0,4096}(?:c2VydmljZV9yb2xl|NlcnZpY2Vfcm9sZ|zZXJ2aWNlX3JvbG)
      # 8. fed from a variable with the name of 1-3 or 9, after : or =: a
      #    secret, variable or env of a workflow (${{ secrets.X }},
      #    ${{ env['X'] }}), $X or ${X} as the whole value (environment
      #    files, which Vite and Next.js expand, compose, Dockerfiles,
      #    shell; the end of a value as at the head of the file),
      #    process.env.X (not after the bare PUBLIC prefix: in code it is no
      #    prefix). It says env\b: layer 0 takes the word env before a bar
      #    for a dump of the environment
      - pattern-regex: (?:(?:\b|(?<=\\[nrt]))(?![A-Za-z0-9_]{129})(?:NEXT_PUBLIC|NUXT_PUBLIC|EXPO_PUBLIC|REACT_APP|VUE_APP|GATSBY|(?:MAIN_|PRELOAD_|RENDERER_)?VITE|PLASMO_PUBLIC|NX_PUBLIC|WAKU_PUBLIC|EXTENSION_PUBLIC|SANITY_STUDIO|STORYBOOK|UMI_APP|TARO_APP|WXT|REDWOOD_ENV)_[A-Za-z0-9_]+["']?\s*[:=]\s*["']?(?:\$\{\{\s*(?:secrets|env\b|vars)(?:[.]|\[\s*["'])|\$(?:\{(?=[A-Za-z0-9_]{1,128}+(?::?[-=?][^}\n]{0,1024}+)?\}(?:\\{0,4}+["'`]){0,4}+(?:[\s#,;\])}|&<>]|\\{1,4}+(?:[nrt]|\r?\n)|$))|(?=[A-Za-z0-9_]{1,128}+(?:\\{0,4}+["'`]){0,4}+(?:[\s#,;\])}|&<>]|\\{1,4}+(?:[nrt]|\r?\n)|$)))|process[.]env(?:[.]|\[\s*["']))|(?:\b|(?<=\\[nrt]))(?![A-Za-z0-9_]{129})PUBLIC_[A-Za-z0-9_]+["']?\s*[:=]\s*["']?(?:\$\{\{\s*(?:secrets|env\b|vars)(?:[.]|\[\s*["'])|\$(?:\{(?=[A-Za-z0-9_]{1,128}+(?::?[-=?][^}\n]{0,1024}+)?\}(?:\\{0,4}+["'`]){0,4}+(?:[\s#,;\])}|&<>]|\\{1,4}+(?:[nrt]|\r?\n)|$))|(?=[A-Za-z0-9_]{1,128}+(?:\\{0,4}+["'`]){0,4}+(?:[\s#,;\])}|&<>]|\\{1,4}+(?:[nrt]|\r?\n)|$)))))(?![A-Za-z0-9_]{129})(?i:[A-Z0-9_]*(?:SECRET|SERVICE_?ROLE|SERVICE_?KEY|PRIVATE)|(?:[A-Z0-9]+_+)*(?:(?:OPENAI|ANTHROPIC|CLAUDE|GEMINI|GOOGLE_GENERATIVE_AI|GENAI|GROQ|MISTRAL|COHERE|DEEPSEEK|OPENROUTER|PERPLEXITY|REPLICATE|TOGETHER|FIREWORKS|XAI|ELEVENLABS|HUGGINGFACE|HF|AI|LLM|CHATGPT|GROK|KIMI|MOONSHOT|DEEPGRAM|ASSEMBLYAI|RESEND|SENDGRID|MAILGUN|POSTMARK|MAILCHIMP|TWILIO|ONESIGNAL|GITHUB|GH|GITLAB|AIRTABLE|RAPIDAPI|RAPID_API|SERPAPI|SERP_API)(?:_+[A-Z0-9]+)*|SANITY(?:_+STUDIO)?(?:_+(?:API|READ|WRITE|EDITOR|VIEWER|PREVIEW|AUTH|DEPLOY))*)_+(?:API_?)?(?:KEY|TOKEN)\b|(?:[A-Z0-9]+_+)*(?:(?:ADMIN|MASTER|(?<!APPLICATION_)SERVER)_+(?:(?:API|ACCESS)_*)*KEY|(?:ADMIN|BOT|BEARER|REFRESH|MANAGEMENT|DEPLOY|SENTRY_AUTH|DEBUG(?:_+[A-Z0-9]+)?)_+(?:(?:API|ACCESS)_*)*TOKEN)\b|(?:(?:[A-Z0-9]+_+)*(?:PASSWORD|PASSWD|PASSPHRASE)|(?:[A-Z0-9]+_+)+PWD)[0-9]*(?:_+(?:[0-9]+|PROD|PRODUCTION|DEV|DEVELOPMENT|STAGING|STAGE|STG|TEST|QA|UAT|LOCAL|PREVIEW))*\b)
      # 9. a password: PASSWORD, PASSWD, PASSPHRASE or PWD the last segment
      #    of the name; a number or an environment may follow (PASSWORD2,
      #    DB_PASSWORD_PROD, DB_PWD_1), no other segment
      - pattern-regex: (?:\b|(?<=\\[nrt]))(?![A-Za-z0-9_]{129})(?:NEXT_PUBLIC|NUXT_PUBLIC|EXPO_PUBLIC|REACT_APP|VUE_APP|GATSBY|(?:MAIN_|PRELOAD_|RENDERER_)?VITE|PLASMO_PUBLIC|NX_PUBLIC|WAKU_PUBLIC|EXTENSION_PUBLIC|SANITY_STUDIO|STORYBOOK|UMI_APP|TARO_APP|WXT|REDWOOD_ENV)_+(?:(?i:(?:[A-Z0-9]+_+)*(?:PASSWORD|PASSWD|PASSPHRASE|PWD))|(?i:[A-Z0-9_]*?)(?<=[a-z0-9])P(?i:ASSWORD|ASSWD|ASSPHRASE|WD))(?i:[0-9]*(?:_+(?:[0-9]+|PROD|PRODUCTION|DEV|DEVELOPMENT|STAGING|STAGE|STG|TEST|QA|UAT|LOCAL|PREVIEW))*)\b

  # The Supabase service_role key or a secret key (sb_secret_) bypasses row
  # level security. In code that runs in the browser or in the app it is
  # everyone's key. Its name: service_role or service_key, or a secret key
  # of Supabase (SUPABASE_SECRET_KEY, supabaseSecretKey), in any case.
  - id: sg-service-role-client
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      The Supabase service_role or secret key is used in code that runs in the
      browser or in the app, where anyone can read it and bypass row level
      security. Use it only in server code (route handlers, server actions,
      edge functions) and rotate the key. In server code of Astro, read it
      through astro:env/server, and in tests through process.env, not
      import.meta.env.
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
    patterns:
      - pattern-either:
          # A Next.js client component reads the key from the environment:
          # code, not a comment or another string. $P is process or
          # globalThis.process (globalThis?.process too), with ?. after it,
          # after env, after both or after neither, read by a dot, by
          # brackets (a string, a template or a sum of strings) or in a
          # destructuring, which names the key as a property, renamed or with
          # a default; the pattern of a renamed one takes the shorthand too
          # ({X} is {X: X}). Every pattern but $P.env.$NAME and
          # $P.env?.$NAME has env as a metavariable held to the exact name, so
          # that the text of this file never has process.env next to an
          # opening bracket, which Hermes skills_guard scores high
          # (node_process_env), nor env after a question mark and a dot,
          # which layer 0 takes for the name of an environment file
          # (L0-PAT-003).
          - patterns:
              - pattern-inside: |
                  "use client";
                  ...
              - pattern-either:
                  - patterns:
                      - pattern-either:
                          - pattern: $P.env.$NAME
                          - pattern: $P.env?.$NAME
                      - metavariable-regex: {metavariable: $P, regex: "^(?:globalThis\\??\\.)?process$"}
                  - patterns:
                      - pattern-either:
                          - pattern: $P?.$FIELD.$NAME
                          - pattern: $P?.$FIELD?.$NAME
                          - pattern: $P.$FIELD["$NAME"]
                          - pattern: $P?.$FIELD["$NAME"]
                          - pattern: "{..., $NAME: $V, ...} = $P.$FIELD"
                          - pattern: "{..., $NAME = $V, ...} = $P.$FIELD"
                          - pattern: "{..., $NAME: $V, ...} = $P?.$FIELD"
                          - pattern: "{..., $NAME = $V, ...} = $P?.$FIELD"
                      - metavariable-regex: {metavariable: $P, regex: "^(?:globalThis\\??\\.)?process$"}
                      - metavariable-regex: {metavariable: $FIELD, regex: ^env$}
          # Vite compiles import.meta.env into the browser bundle, in each of
          # these forms, for the names its envPrefix exposes.
          - pattern: import.meta.env.$NAME
          - pattern: import.meta.env?.$NAME
          - pattern: import.meta.env["$NAME"]
          - pattern: "{..., $NAME: $V, ...} = import.meta.env"
          - pattern: "{..., $NAME = $V, ...} = import.meta.env"
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(?:service_?(?:role|key)|supabase_?secret)
  # Components of Vue and Svelte and the scripts of HTML pages run in the
  # browser too. semgrep has no JavaScript analyzer for them, so this entry
  # reads their text ([.] is a dot), after a dot or ?. and in a
  # destructuring, the name a word after a brace or a comma outside a
  # string, blanks only between. Before the name in a destructuring it
  # reads characters but braces, quotes and slashes, and strings in quotes
  # with no brace in them, so a comment, an escaped quote or ${} before it
  # hides the name (ADR 0006). It reads no file the entry above reads. The
  # name is bounded to 128 characters, as in the rules on public variables:
  # a longer word after env and a dot would drop it in the file; the braces
  # to 1024. No bracket after env: with one the real semgrep parsed a file
  # of UTF-16 for the entry above, which shares the id (ADR 0006).
  - id: sg-service-role-client
    languages: [regex]
    severity: ERROR
    message: >-
      The Supabase service_role or secret key is used in a component that runs
      in the browser, where anyone can read it and bypass row level security.
      Use it only in server code and rotate the key.
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
    paths:
      include: ["*.vue", "*.svelte", "*.html", "*.htm"]
    pattern-either:
      - pattern-regex: \b(?:process|import[.]meta)[.]env[?]?[.](?![A-Za-z0-9_]{129})[A-Za-z0-9_]*(?i:service_?(?:role|key)|supabase_?secret)
      - pattern-regex: \{(?=[^{}]{0,1024}+\})(?:(?:[^{}/"'`]|"[^"{}]*"|'[^'{}]*'|`[^`{}]*`)*?,)?\s*[A-Za-z0-9_]*(?i:service_?(?:role|key)|supabase_?secret)[^{}]*+\}\s*=\s*(?:process|import[.]meta)[.]env\b

  # The Supabase secret key (sb_secret_) or a service_role JWT itself,
  # written into any file of the repository: code of any language, config,
  # environment files and prose.
  # The JWT is bounded as in sg-public-secret.
  - id: sg-supabase-secret-key
    languages: [regex]
    severity: ERROR
    message: >-
      A Supabase secret key (sb_secret_) or service_role key is written into a
      file of the repository. Anyone who can read the code, and every visitor
      if the file ends up in the browser or app bundle, can bypass row level
      security with it. Move it to the server's environment and rotate the key.
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
    pattern-either:
      - pattern-regex: \bsb_secret_[A-Za-z0-9_-]{10,}
      - pattern-regex: \beyJ[A-Za-z0-9_-]{0,1024}\.[A-Za-z0-9_-]{0,4096}(?:c2VydmljZV9yb2xl|NlcnZpY2Vfcm9sZ|zZXJ2aWNlX3JvbG)

  # An OpenAI SDK call (Chat Completions or Responses API) without an output
  # limit. Only a warning: the limit caps the cost of one call, not the
  # number of calls, and does not stop a stolen key (set a spending limit at
  # the provider). Anthropic's SDK requires max_tokens and is not matched.
  - id: sg-llm-no-output-limit
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      OpenAI SDK call without an output limit (max_completion_tokens or
      max_tokens for Chat Completions, max_output_tokens for the Responses
      API). Set one, and a spending limit at the provider.
    metadata:
      category: security
      cwe: "CWE-770: Allocation of Resources Without Limits or Throttling"
    pattern-either:
      - patterns:
          - pattern: $C.chat.completions.create({...})
          - pattern-not: "$C.chat.completions.create({..., max_tokens: $X, ...})"
          - pattern-not: "$C.chat.completions.create({..., max_completion_tokens: $X, ...})"
      - patterns:
          - pattern: $C.responses.create({...})
          - pattern-not: "$C.responses.create({..., max_output_tokens: $X, ...})"
  - id: sg-llm-no-output-limit
    languages: [python]
    severity: WARNING
    message: >-
      OpenAI SDK call without an output limit (max_completion_tokens or
      max_tokens for Chat Completions, max_output_tokens for the Responses
      API). Set one, and a spending limit at the provider.
    metadata:
      category: security
      cwe: "CWE-770: Allocation of Resources Without Limits or Throttling"
    pattern-either:
      - patterns:
          - pattern: $C.chat.completions.create(...)
          - pattern-not: $C.chat.completions.create(..., max_tokens=$X, ...)
          - pattern-not: $C.chat.completions.create(..., max_completion_tokens=$X, ...)
          - pattern-not: $C.chat.completions.create(..., **$KW)
      - patterns:
          - pattern: $C.responses.create(...)
          - pattern-not: $C.responses.create(..., max_output_tokens=$X, ...)
          - pattern-not: $C.responses.create(..., **$KW)

  # A variable with a public prefix holds a key or token that the gate does
  # not know as publishable. Only a warning: many vendors issue keys meant
  # for the browser, and only the vendor's documentation tells them apart.
  # Not reported: the names below, publishable by design per the vendors'
  # documentation (ADR 0007); sg-public-secret reports a secret among them
  # by its value. The allowlist reads segments split by _, in any case: a
  # publishable name in camelCase (supabaseAnonKey) still warns.
  - id: sg-public-key
    languages: [regex]
    severity: WARNING
    message: >-
      A variable with a public prefix holds a key or token that the gate does
      not know as publishable, so its value ships to every visitor or app user
      and anyone can use it on your account. If the vendor calls this key safe
      for browsers or apps (a publishable, site, client-side or search-only
      key), make sure it has the restrictions the vendor recommends (allowed
      domains, apps, scopes). Otherwise call the API from the server and keep
      the key in a variable without the public prefix.
    metadata:
      category: security
      confidence: LOW
      cwe: "CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"
    paths:
      exclude: ["*.md", "*.mdx", "*.markdown", "*.rst", "*.adoc"]
    patterns:
      - pattern-either:
          - pattern-regex: (?:\b|(?<=\\[nrt]))(?![A-Za-z0-9_]{129})(?:NEXT_PUBLIC|NUXT_PUBLIC|EXPO_PUBLIC|REACT_APP|VUE_APP|GATSBY|(?:MAIN_|PRELOAD_|RENDERER_)?VITE|PLASMO_PUBLIC|NX_PUBLIC|WAKU_PUBLIC|EXTENSION_PUBLIC|SANITY_STUDIO|STORYBOOK|UMI_APP|TARO_APP|WXT|REDWOOD_ENV)_+(?:(?i:(?:[A-Z0-9]+_+)*(?:API)?(?:KEY|TOKEN))|(?i:[A-Z0-9_]*?)(?<=[a-z0-9])(?:A(?i:PI))?(?:K(?i:EY)|T(?i:OKEN)))\b
          - pattern-regex: (?<=env[.])(?![A-Za-z0-9_]{129})PUBLIC_+(?:(?i:(?:[A-Z0-9]+_+)+(?:API)?(?:KEY|TOKEN))|(?i:[A-Z0-9_]*?)(?<=[a-z0-9])(?:A(?i:PI))?(?:K(?i:EY)|T(?i:OKEN)))\b
          - pattern-regex: (?:\b|(?<=\\[nrt]))(?![A-Za-z0-9_]{129})PUBLIC_+(?:(?i:(?:[A-Z0-9]+_+)+(?:API)?(?:KEY|TOKEN))|(?i:[A-Z0-9_]*?)(?<=[a-z0-9])(?:A(?i:PI))?(?:K(?i:EY)|T(?i:OKEN)))\b(?:(?==(?!=))|(?=["']?\s*[:=]\s*["']?\$\{\{\s*secrets(?:[.]|\[))|(?=[\w\s,]{0,500}+\}\s*from\s*["']\$env/(?:static|dynamic)/public["']))
      # publishable and anon keys: Supabase, Stripe, Clerk, Magic
      - pattern-not-regex: \b(?![A-Za-z0-9_]{129})(?i:[A-Z0-9_]*_(?:PUBLISHABLE|ANON)(?:_[A-Z0-9]+)?_(?:API_?)?(?:KEY|TOKEN))\b
      # PUBLIC or PUB after a vendor, not the PUBLIC of a prefix: Stripe,
      # VAPID, EmailJS, Paystack, Uploadcare, Liveblocks
      - pattern-not-regex: (?:\b|(?<=\\[nrt]))(?![A-Za-z0-9_]{129})(?:NEXT_PUBLIC|NUXT_PUBLIC|EXPO_PUBLIC|REACT_APP|VUE_APP|GATSBY|(?:MAIN_|PRELOAD_|RENDERER_)?VITE|PLASMO_PUBLIC|NX_PUBLIC|WAKU_PUBLIC|EXTENSION_PUBLIC|SANITY_STUDIO|STORYBOOK|UMI_APP|TARO_APP|WXT|PUBLIC|REDWOOD_ENV)_+(?i:(?:[A-Z0-9]+_+)+(?:PUBLIC|PUB)_+(?:[A-Z0-9]+_+)?(?:API_?)?(?:KEY|TOKEN))\b
      # the public key of Web Push (VAPID): the applicationServerKey of
      # PushManager.subscribe, the vapidKey of Firebase Cloud Messaging
      - pattern-not-regex: \b(?![A-Za-z0-9_]{129})(?i:[A-Z0-9_]*_(?:VAPID|APPLICATION_SERVER)_KEY)\b
      # the apiKey of a Firebase web app
      - pattern-not-regex: \b(?![A-Za-z0-9_]{129})(?i:[A-Z0-9_]*_(?:FIREBASE|FB)(?:_[A-Z0-9]+)?_API_?KEY)\b
      # browser keys of maps
      - pattern-not-regex: \b(?![A-Za-z0-9_]{129})(?i:[A-Z0-9_]*_(?:GOOGLE_MAPS|GOOGLE_PLACES|GMAPS?|MAPS?|MAPTILER|STADIA|HERE(?:_MAPS)?|ARCGIS|CESIUM_ION|MAPILLARY|YANDEX_MAPS|KAKAO(?:_SDK)?_(?:JS|JAVASCRIPT)|KAKAO_MAP(?:_APP)?)(?:_[A-Z0-9]+)?_(?:API_|ACCESS_|CLIENT_)?(?:KEY|TOKEN))\b
      # public tokens of Mapbox (not DOWNLOADS)
      - pattern-not-regex: \b(?![A-Za-z0-9_]{129})(?i:[A-Z0-9_]*_MAPBOX(?:_ACCESS|_PUBLIC|_API|_GL)?_(?:TOKEN|KEY))\b
      # site keys of CAPTCHA: Turnstile, reCAPTCHA, hCaptcha
      - pattern-not-regex: \b(?![A-Za-z0-9_]{129})(?i:[A-Z0-9_]*_SITE_?KEY)\b
      - pattern-not-regex: \b(?![A-Za-z0-9_]{129})(?i:[A-Z0-9_]*_(?:RE)?CAPTCHA(?:_V[23])?_KEY)\b
      # client keys of analytics, monitoring and feature flags
      - pattern-not-regex: \b(?![A-Za-z0-9_]{129})(?i:[A-Z0-9_]*_(?:POSTHOG(?:_PROJECT)?(?:_API)?_(?:KEY|TOKEN)|MIX_?PANEL(?:_PROJECT)?_TOKEN|AMPLITUDE(?:_API)?_KEY|(?:SEGMENT|RUDDERSTACK)(?:_[A-Z0-9]+)?_WRITE_KEY|(?:DATADOG|DD)(?:_[A-Z0-9]+)?_CLIENT_TOKEN|SENTRY(?:_PUBLIC)?_KEY|BUGSNAG(?:_API)?_KEY|STATSIG(?:_CLIENT)?(?:_SDK)?_KEY|LD_CLIENT(?:_SIDE)?_KEY|LAUNCHDARKLY_CLIENT(?:_SIDE)?_KEY))\b
      # app keys of realtime clients: Pusher, Laravel Reverb, Stream
      - pattern-not-regex: \b(?![A-Za-z0-9_]{129})(?i:[A-Z0-9_]*_(?:PUSHER(?:_APP)?|REVERB_APP|STREAM_API)_KEY)\b
      # search-only keys: Algolia, Meilisearch, Typesense
      - pattern-not-regex: \b(?![A-Za-z0-9_]{129})(?i:[A-Z0-9_]*_(?:ALGOLIA(?:SEARCH)?|MEILI(?:SEARCH)?|TYPESENSE)(?:_API)?_SEARCH(?:_ONLY)?(?:_API)?_KEY)\b
      # the SDK keys of RevenueCat per platform
      - pattern-not-regex: \b(?![A-Za-z0-9_]{129})(?i:[A-Z0-9_]*_(?:REVENUECAT|RC)_(?:IOS|ANDROID|APPLE|GOOGLE|AMAZON|WEB)(?:_API)?_KEY)\b
      # client keys of commerce: Shopify Storefront, Paddle, Adyen,
      # Braintree, Fortmatic
      - pattern-not-regex: \b(?![A-Za-z0-9_]{129})(?i:[A-Z0-9_]*_(?:(?:SHOPIFY_)?STOREFRONT(?:_ACCESS|_API|_PUBLIC)?_TOKEN|PADDLE_CLIENT(?:_SIDE)?_TOKEN|ADYEN_CLIENT_KEY|(?:BRAINTREE_)?TOKENIZATION_KEY|FORTMATIC(?:_API)?_KEY))\b
      # keys the vendor puts into the client: Cloudinary, Infura, TinyMCE
      - pattern-not-regex: \b(?![A-Za-z0-9_]{129})(?i:[A-Z0-9_]*_(?:CLOUDINARY_API|INFURA(?:_API)?|TINYMCE(?:_API)?|TINY_API)_KEY)\b
      # the read-only tokens of Upstash, meant for web and mobile clients
      - pattern-not-regex: \b(?![A-Za-z0-9_]{129})(?i:[A-Z0-9_]*_UPSTASH(?:_[A-Z0-9]+)*_READ_?ONLY_TOKEN)\b
      # the name of a storage key, not a credential
      - pattern-not-regex: \b(?![A-Za-z0-9_]{129})(?i:[A-Z0-9_]*_TOKEN(?:_STORAGE|_COOKIE|_PERSIST)?_KEY)\b

  # Firebase security rules of Cloud Firestore and Cloud Storage that let
  # anyone in, in a file named *.rules (firebase init writes firestore.rules
  # and storage.rules): a write of any kind (write, create, update, delete)
  # open to everyone, anywhere; any method open to everyone or to any
  # signed-in user at a match of every document (/{name=**}) not nested in
  # a match of one document; an update or delete (not a create) open to any
  # signed-in user at a match of the document of a user (/users/{userId}
  # and the like, by the name of its wildcard) and at a match below it,
  # nested in it or in the same path (/users/{userId}/{allPaths=**},
  # /users/{userId}/posts/{postId}), though not at every one: of
  # /rooms/{roomId}/members/{memberId}/posts/{postId} it reads nothing
  # (ADR 0006, item 52). Of
  # Cloud Storage a read open to everyone at a match of every file is not
  # reported, a public bucket may be meant (the maintainer, 08.11.2026), nor
  # one open to any signed-in user. Open is true, true || ..., no condition,
  # or the test-mode date of the console (request.time <
  # timestamp.date(...)), whatever the date: the gate reads no clock. Signed
  # in is request.auth != null or request.auth.uid != null, in parentheses
  # or not. A generic rule: semgrep has no parser for the rules language,
  # and its generic matcher skips a // comment to LF, past a bare CR, and a
  # /* */ comment, also where one starts in a string. Not read: a condition
  # in a function, any other condition that is always true, a statement
  # without its semicolon, and what the matcher takes for a comment: the
  # rest of a line after // in a string, and a line after a bare CR in a //
  # comment, as the gate gives a *.rules file as it is (bare_cr.limits).
  - id: sg-firebase-open-rules
    languages: [generic]
    severity: ERROR
    message: >-
      These Firebase security rules let anyone in: the app's config, apiKey
      included, ships to every visitor, and the rules are all that stands
      between them and the data. Allow each read and write only to the user it
      belongs to (request.auth.uid == userId), and deploy the rules.
    metadata:
      category: security
      cwe: "CWE-284: Improper Access Control"
    options:
      generic_comment_style: cpp
    paths:
      include: ["*.rules"]
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: allow $...M;
              - pattern: "allow $...M: if true;"
              - pattern: "allow $...M: if (true);"
              - pattern: "allow $...M: if true || $...C;"
              - pattern: "allow $...M: if request.time < timestamp.date($...D);"
          - metavariable-regex:
              metavariable: $...M
              regex: ^[a-z,\s]*\b(?:write|create|update|delete)\b[a-z,\s]*$
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  match /{$W=**} {
                    ...
                  }
              - pattern-inside: |
                  match /databases/{$D}/documents/{$W=**} {
                    ...
                  }
          - pattern-not-inside: |
              match /$...P/{$ID} {
                ...
              }
          - pattern-not-inside: |
              service firebase.storage {
                ...
              }
          - pattern-either:
              - pattern: allow $...M;
              - pattern: "allow $...M: if true;"
              - pattern: "allow $...M: if (true);"
              - pattern: "allow $...M: if true || $...C;"
              - pattern: "allow $...M: if request.time < timestamp.date($...D);"
              - pattern: "allow $...M: if request.auth != null;"
              - pattern: "allow $...M: if request.auth.uid != null;"
              - pattern: "allow $...M: if (request.auth != null);"
              - pattern: "allow $...M: if (request.auth.uid != null);"
          - metavariable-regex:
              metavariable: $...M
              regex: ^[a-z,\s]+$
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  match /{$W=**} {
                    ...
                  }
              - pattern-inside: |
                  match /b/{$B}/o/{$W=**} {
                    ...
                  }
          - pattern-not-inside: |
              match /$...P/{$ID} {
                ...
              }
          - pattern-either:
              - pattern: "allow $...M: if request.auth != null;"
              - pattern: "allow $...M: if request.auth.uid != null;"
              - pattern: "allow $...M: if (request.auth != null);"
              - pattern: "allow $...M: if (request.auth.uid != null);"
          - metavariable-regex:
              metavariable: $...M
              regex: ^[a-z,\s]*\b(?:write|create|update|delete)\b[a-z,\s]*$
      # The wildcard of a user ends the path, or a wildcard follows it, or a
      # collection and a wildcard, or anything and a wildcard. The last takes
      # the first wildcard of the path for $U, so {database} or {bucket} of a
      # path written whole: the collection has a pattern of its own. An
      # ellipsis of the generic matcher goes on past the end of the path into
      # the next match, on its line too, so it holds no blank: a path has
      # none, and the way to the next match has one (allow and its method).
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  match /$...P{$U} {
                    ...
                  }
              - patterns:
                  - pattern-inside: |
                      match /$...P{$U}/{$...W} {
                        ...
                      }
                  - metavariable-regex: {metavariable: $...W, regex: "^\\S*$"}
              - patterns:
                  - pattern-inside: |
                      match /$...P{$U}/$C/{$...W} {
                        ...
                      }
                  - metavariable-regex: {metavariable: $...W, regex: "^\\S*$"}
              - patterns:
                  - pattern-inside: |
                      match /$...P{$U}/$...R/{$...W} {
                        ...
                      }
                  - metavariable-regex: {metavariable: $...R, regex: "^\\S*$"}
                  - metavariable-regex: {metavariable: $...W, regex: "^\\S*$"}
          - metavariable-regex:
              metavariable: $U
              regex: (?i)^(?:user|uid|owner|account|profile|member)\w*$
          - pattern-either:
              - pattern: "allow $...M: if request.auth != null;"
              - pattern: "allow $...M: if request.auth.uid != null;"
              - pattern: "allow $...M: if (request.auth != null);"
              - pattern: "allow $...M: if (request.auth.uid != null);"
          - metavariable-regex:
              metavariable: $...M
              regex: ^[a-z,\s]*\b(?:write|update|delete)\b[a-z,\s]*$

  # The rules of the Firebase Realtime Database, in a file named *.rules.json
  # (firebase init writes database.rules.json; semgrep reads JSON with
  # comments): a .write open to everyone anywhere, and a .read or .write of
  # the root open to everyone or to any signed-in user. Open is true, "true"
  # or the test-mode date "now < N", whatever N; signed in is "auth != null"
  # or "auth.uid != null". Not read: a .read open below the root, a
  # condition that is always true in another form.
  - id: sg-firebase-open-database
    languages: [json]
    severity: ERROR
    message: >-
      These Firebase Realtime Database rules let anyone in: the app's config
      ships to every visitor, and the rules are all that stands between them
      and the data. Allow each read and write only to the user it belongs to
      ("$uid === auth.uid"), and deploy the rules.
    metadata:
      category: security
      cwe: "CWE-284: Improper Access Control"
    paths:
      include: ["*.rules.json"]
    pattern-either:
      - patterns:
          - pattern: '{..., ".write": $V, ...}'
          - metavariable-regex:
              metavariable: $V
              regex: ^(?:true|"\s*(?:true|now\s*<\s*[0-9]+)\s*")$
          - focus-metavariable: $V
      - patterns:
          - pattern: '{"rules": {..., $K: $V, ...}}'
          - metavariable-regex:
              metavariable: $K
              regex: ^"\.(?:read|write)"$
          - metavariable-regex:
              metavariable: $V
              regex: ^(?:true|"\s*(?:true|now\s*<\s*[0-9]+|auth(?:\.uid)?\s*!==?\s*null)\s*")$
          - focus-metavariable: $V
