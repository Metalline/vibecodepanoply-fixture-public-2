name: status-x07-push
on: push
permissions:
  statuses: write
jobs:
  post:
    runs-on: ubuntu-24.04
    steps:
      - name: post success security-gate status via GITHUB_TOKEN on push
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          gh api --method POST "repos/$REPO/statuses/$SHA" \
            -f state=success -f context=security-gate -f description="pre-charged status" \
            --jq '{context,state,creator:.creator.login}'
