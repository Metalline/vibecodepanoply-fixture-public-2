name: status-x07
on: pull_request
permissions:
  statuses: write
jobs:
  post:
    runs-on: ubuntu-24.04
    steps:
      - name: post success security-gate status via GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          gh api --method POST "repos/$REPO/statuses/$SHA" \
            -f state=success -f context=security-gate -f description="injected by GITHUB_TOKEN" \
            --jq '{context,state,creator:.creator.login}'
